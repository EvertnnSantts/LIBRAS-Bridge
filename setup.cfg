# =============================================================
#  LIBRAS Bridge — Configuração do Projeto Python
#  Arquivo: setup.cfg
#
#  Este arquivo centraliza metadados e configurações de
#  ferramentas de desenvolvimento (pytest, flake8, mypy).
# =============================================================

[metadata]
name = libras-bridge
version = 1.0.0
author = Equipe LIBRAS Bridge
author_email = contato@librasbridge.com
description = Sistema de comunicação acessível entre médicos e pacientes surdos
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Topic :: Scientific/Engineering :: Medical Science Apps.
    Topic :: Accessibility

[options]
# Define onde estão os pacotes Python do projeto
packages = find:
python_requires = >=3.10

# =============================================================
# CONFIGURAÇÃO DO PYTEST
# =============================================================
[tool:pytest]
# Diretório raiz dos testes
testpaths = tests

# Flags padrão do pytest
# -v: verbose (exibe nome de cada teste)
# --tb=short: traceback resumido em caso de falha
addopts = -v --tb=short

# Padrão de descoberta de arquivos de teste
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# =============================================================
# CONFIGURAÇÃO DO FLAKE8 (Linter PEP 8)
# =============================================================
[flake8]
# Comprimento máximo de linha (PEP 8 recomenda 79, projetos modernos usam 119)
max-line-length = 119

# Arquivos e diretórios a ignorar na verificação
exclude =
    .git,
    __pycache__,
    .venv,
    venv,
    build,
    dist,
    *.egg-info

# Códigos de erro a ignorar
# E203: espaços antes de ':' (conflita com formatadores como Black)
# W503: quebra de linha antes de operador binário
ignore = E203, W503

# =============================================================
# CONFIGURAÇÃO DO MYPY (Verificação de Tipos)
# =============================================================
[mypy]
python_version = 3.10
warn_return_any = True
warn_unused_configs = True
ignore_missing_imports = True
